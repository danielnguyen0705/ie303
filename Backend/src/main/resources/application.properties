# Data Source
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.preparedStatementCacheQueries=0
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:900000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_TIME_MS:300000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:20000}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Redis / Upstash
spring.data.redis.url=${UPSTASH_REDIS_URL}
spring.data.redis.timeout=5s
# We use Redis for caching only; keep Spring Data Redis from scanning JPA repos.
spring.data.redis.repositories.enabled=false
spring.cache.type=redis

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=false
spring.jpa.properties.hibernate.generate_statistics=false

# Resend API
resend.api-key=${RESEND_API_KEY:}
resend.api-url=${RESEND_API_URL:https://api.resend.com/emails}
resend.from-email=${RESEND_FROM_EMAIL:${MAIL_FROM_EMAIL:}}

# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# Default profile cosmetics
user.default-avatar-base-url=${USER_DEFAULT_AVATAR_BASE_URL:https://api.dicebear.com/7.x/avataaars/svg?seed=}
user.default-background-url=${USER_DEFAULT_BACKGROUND_URL:https://images.unsplash.com/photo-1522542550221-31fd19575a2d?auto=format&fit=crop&w=1600&q=80}

# NVIDIA
# Allow empty default so app can start when env var isn't set.
# The service will still throw an error at runtime if the key is required for an AI call.
nvidia.api-key=${NVIDIA_API_KEY:}
nvidia.base-url=${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
nvidia.text-model=${NVIDIA_TEXT_MODEL:meta/llama-3.1-8b-instruct}
nvidia.vision-model=${NVIDIA_VISION_MODEL:meta/llama-3.2-11b-vision-instruct}

# Cloudinary
cloudinary.cloud-name=${CLOUD_NAME}
cloudinary.api-key=${API_KEY}
cloudinary.api-secret=${API_SECRET}

# Multipart upload (audio/image)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# Payments
payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET:}
payment.mock-confirm-enabled=${PAYMENT_MOCK_CONFIRM_ENABLED:false}

payment.momo.pay-url=${PAYMENT_MOMO_PAY_URL:https://test-payment.momo.vn/mock}
payment.momo.secret=${PAYMENT_MOMO_SECRET:}
payment.momo.enabled=${PAYMENT_MOMO_ENABLED:true}

payment.vnpay.pay-url=${PAYMENT_VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
payment.vnpay.tmn-code=${PAYMENT_VNPAY_TMN_CODE:}
payment.vnpay.secret=${PAYMENT_VNPAY_SECRET:}

payment.bank.qr-base-url=${PAYMENT_BANK_QR_BASE_URL:https://img.vietqr.io/image}
payment.bank.bank-bin=${PAYMENT_BANK_BIN:970415}
payment.bank.account-number=${PAYMENT_BANK_ACCOUNT_NUMBER:0000000000}
payment.bank.secret=${PAYMENT_BANK_SECRET:}

# Notifications
notification.time-zone=${NOTIFICATION_TIME_ZONE:Asia/Ho_Chi_Minh}
notification.vip-reminder.cron=${NOTIFICATION_VIP_REMINDER_CRON:0 0 9 * * *}
notification.vip-reminder.days-before=${NOTIFICATION_VIP_REMINDER_DAYS_BEFORE:3}
notification.streak-reminder.cron=${NOTIFICATION_STREAK_REMINDER_CRON:0 0 9 * * *}
notification.streak-reset.cron=${NOTIFICATION_STREAK_RESET_CRON:0 5 0 * * *}

# App URLs
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.backend-public-base-url=${BACKEND_PUBLIC_BASE_URL:http://localhost:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ML service
ml.api.url=${ML_API_URL:http://localhost:8000/predict}
ml.timeout-ms=${ML_TIMEOUT_MS:15000}
ml.connect-timeout-ms=${ML_CONNECT_TIMEOUT_MS:3000}
ml.read-timeout-ms=${ML_READ_TIMEOUT_MS:15000}

# application.properties
server.port=${PORT:8080}
server.forward-headers-strategy=framework
