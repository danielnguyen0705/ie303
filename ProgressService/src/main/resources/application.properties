spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.application.name=progress-service

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:local-dev-jwt-secret-change-me-1234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
server.port=${PORT:8087}
server.forward-headers-strategy=framework
ml.api-url=${ML_API_URL:http://localhost:8000/predict}

spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.cache.type=simple
logging.level.io.lettuce.core=ERROR

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

spring.flyway.baseline-on-migrate=true
