spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:local-dev-jwt-secret-change-me-1234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.cookie-secure=${APP_COOKIE_SECURE:false}
app.cookie-same-site=${APP_COOKIE_SAME_SITE:Lax}

spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.cache.type=simple

cloudinary.cloud-name=${CLOUD_NAME:}
cloudinary.api-key=${API_KEY:}
cloudinary.api-secret=${API_SECRET:}

notification.service.base-url=${NOTIFICATION_SERVICE_BASE_URL:http://localhost:8082}

spring.rabbitmq.addresses=${CLOUDAMQP_URL:amqp://guest:guest@rabbitmq:5672/%2F}

server.port=${PORT:8085}
server.forward-headers-strategy=framework
