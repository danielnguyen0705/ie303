# Data Source
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:local-dev-jwt-secret-change-me-1234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

# App URLs
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.cookie-secure=${APP_COOKIE_SECURE:false}
app.cookie-same-site=${APP_COOKIE_SAME_SITE:Lax}

# Payments
payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET:}
payment.mock-confirm-enabled=${PAYMENT_MOCK_CONFIRM_ENABLED:false}

payment.momo.pay-url=${PAYMENT_MOMO_PAY_URL:https://test-payment.momo.vn/mock}
payment.momo.secret=${PAYMENT_MOMO_SECRET:}
payment.momo.enabled=${PAYMENT_MOMO_ENABLED:true}

payment.vnpay.pay-url=${PAYMENT_VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
payment.vnpay.tmn-code=${PAYMENT_VNPAY_TMN_CODE:}
payment.vnpay.secret=${PAYMENT_VNPAY_SECRET:}

payment.bank.qr-base-url=${PAYMENT_BANK_QR_BASE_URL:https://img.vietqr.io/image}
payment.bank.bank-bin=${PAYMENT_BANK_BIN:970415}
payment.bank.account-number=${PAYMENT_BANK_ACCOUNT_NUMBER:0000000000}
payment.bank.secret=${PAYMENT_BANK_SECRET:}

spring.rabbitmq.addresses=${CLOUDAMQP_URL:amqp://guest:guest@rabbitmq:5672/%2F}

server.port=${PORT:8083}
server.forward-headers-strategy=framework
