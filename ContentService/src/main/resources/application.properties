spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.application.name=content-service

# Avoid schema mutation during startup when using a pooled PostgreSQL URL.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:local-dev-jwt-secret-change-me-1234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.cookie-secure=${APP_COOKIE_SECURE:false}
app.cookie-same-site=${APP_COOKIE_SAME_SITE:Lax}

spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.cache.type=simple
logging.level.io.lettuce.core=ERROR
management.endpoints.web.exposure.include=health,info

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.backend-public-base-url=${BACKEND_PUBLIC_BASE_URL:http://localhost:8080}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:${CLOUD_NAME:}}
cloudinary.api-key=${CLOUDINARY_API_KEY:${API_KEY:}}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:${API_SECRET:}}

server.port=${PORT:8086}
server.forward-headers-strategy=framework
