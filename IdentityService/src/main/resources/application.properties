spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:local-dev-jwt-secret-change-me-1234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

user.default-avatar-base-url=${USER_DEFAULT_AVATAR_BASE_URL:https://api.dicebear.com/7.x/avataaars/svg?seed=}
user.default-background-url=${USER_DEFAULT_BACKGROUND_URL:https://images.unsplash.com/photo-1522542550221-31fd19575a2d?auto=format&fit=crop&w=1600&q=80}

app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.backend-public-base-url=${BACKEND_PUBLIC_BASE_URL:http://localhost:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.cookie-secure=${APP_COOKIE_SECURE:false}
app.cookie-same-site=${APP_COOKIE_SAME_SITE:Lax}

notification.service.base-url=${NOTIFICATION_SERVICE_BASE_URL:http://localhost:8082}
progress.service.base-url=${PROGRESS_SERVICE_BASE_URL:http://localhost:8087}

server.port=${PORT:8084}
server.forward-headers-strategy=framework
