# Data Source
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.application.name=notification-service

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Notification
notification.time-zone=${NOTIFICATION_TIME_ZONE:Asia/Ho_Chi_Minh}
notification.vip-reminder.cron=${NOTIFICATION_VIP_REMINDER_CRON:0 0 9 * * *}
notification.vip-reminder.days-before=${NOTIFICATION_VIP_REMINDER_DAYS_BEFORE:3}
notification.streak-reminder.cron=${NOTIFICATION_STREAK_REMINDER_CRON:0 0 9 * * *}
notification.streak-reset.cron=${NOTIFICATION_STREAK_RESET_CRON:0 5 0 * * *}

# Resend API
resend.api-key=${RESEND_API_KEY:}
resend.api-url=${RESEND_API_URL:https://api.resend.com/emails}
resend.from-email=${RESEND_FROM_EMAIL:${MAIL_FROM_EMAIL:}}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# RabbitMQ
spring.rabbitmq.addresses=${CLOUDAMQP_URL:amqp://guest:guest@rabbitmq:5672/%2F}
spring.rabbitmq.listener.simple.auto-startup=${SPRING_RABBITMQ_LISTENER_AUTO_STARTUP:false}

server.port=${PORT:8082}
